# Reference model of the paper (first row of Tables 2, 3, 5 and 6).
# Every ablation in configs/ablations/ inherits from this file and changes one key.

seed: 1337

model:
  # Decoder sharing across the segmentation datasets (Sec. 3.2.1, Table 5):
  #   none       = one full decoder per dataset
  #   last_block = shared decoder, dataset-specific last up-block + 1x1 conv
  #   full       = shared decoder, dataset-specific 1x1 conv only
  decoder_sharing: last_block

data:
  classification: true     # false = segmentation datasets only (no MBH-cls cohort)
  # Crop of the classification positives at training time (Sec. 3.2.3):
  #   pseudo = 5:1 positive/negative crop around the nnU-Net pseudo-lesion
  #   random = random crop, the pseudo-masks are not used at all
  cls_crop: pseudo
  sampling_alpha: 0.5      # dataset sampling mass ~ |D|^alpha (Eq. 4)

loss:
  cls_weight: 0.3          # lambda_cls
  # BCE target of the MBH volumes that have a manual mask (Sec. 3.2.2):
  #   patch  = subtype presence recomputed on the sampled 96^3 patch
  #   volume = case-level label
  cls_target: patch
  pseudo_weight: 0.3       # lambda_pseudo; 0 keeps the pseudo-masks as a sampling prior only
  pseudo_mode: certified   # certified = label-gated target (Fig. 3) | dice = pseudo-mask as ground truth
  pseudo_bg_weight: 0.5    # certified mode: weight of the background term
  mta_weight: 0.3          # lambda_MTA, presence-consistency loss (Eqs. 1-3)
  # Weighting of the segmentation losses (Sec. 3.2.4):
  #   learned = uncertainty weighting with clamped log-variances (Eq. 12)
  #   fixed   = the same constant weight on every dataset (seg_fixed_weight)
  seg_weighting: learned
  seg_fixed_weight: 1.227  # fixed mode: 3 x 1.227 = sum of the learned weights at the end of training

train:
  epochs: 1000
  batch_size: 2
  lr: 1.0e-3               # SGD, Nesterov momentum 0.99, linear decay to 0
  weight_decay: 3.0e-5
  grad_clip: 1.0
  val_every: 5             # epochs between two validations
  num_workers: 8
